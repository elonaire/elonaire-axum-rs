[workspace]
resolver = "2"
members = [
    # Libs
    "lib",
    # Services
    "services/shared-service",
]

[workspace.dependencies]
# Web / HTTP
axum = "0.8.9"
hyper = "1.11.1"
tower-http = { version = "0.6.11", features = ["cors"] }
tower_governor = "=0.8.0"
reqwest = { version = "0.12.28", features = ["json"] }

# Async runtime
tokio = { version = "1.53.1", features = ["full"] }
async-trait = "0.1.92"

# GraphQL
async-graphql = { version = "7.2.1", features = ["chrono"] }
async-graphql-axum = "7.2.1"

# gRPC / Protobuf
tonic = "0.12.3"
tonic-build = "0.12.3"
tonic-middleware = "0.2.3"
prost = "0.13.5"

# Database
surrealdb = "3.2.4"

# Serialization
serde = "1.0.229"

# Tracing / Logging
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tracing-appender = "0.2.5"

# Utilities
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
cookie = "0.18.2"
uuid = "1.26.0"
markdown = "1.0.0"
scraper = "0.25.0"
syntect = "5.3.0"
html2text = "0.16.7"
anyhow = "1.0.104"

# Internal
lib = { path = "lib" }

[profile.release]
strip = true
opt-level = 'z'
lto = true
codegen-units = 1
panic = 'abort'
